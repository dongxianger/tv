<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BD影视 - 极简高清站</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dplayer/dist/DPlayer.min.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js/dist/hls.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dplayer/dist/DPlayer.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #121212; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding-bottom: 30px; }
        header { background: #1f1f1f; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2d2d2d; sticky: top; top: 0; z-index: 100; }
        .logo { font-size: 20px; font-weight: bold; color: #00e676; letter-spacing: 1px; }
        .search-bar { display: flex; margin: 15px 20px; background: #1f1f1f; border-radius: 25px; padding: 5px 15px; border: 1px solid #333; }
        .search-bar input { background: transparent; border: none; color: #fff; width: 100%; padding: 8px; outline: none; font-size: 14px; }
        .search-bar button { background: #00e676; border: none; color: #000; font-weight: bold; padding: 8px 18px; border-radius: 20px; cursor: pointer; }
        
        #playerSection { display: none; margin: 15px 20px; background: #1f1f1f; border-radius: 10px; padding: 10px; border: 1px solid #2d2d2d; }
        #playerTitle { font-size: 16px; font-weight: bold; margin-bottom: 10px; color: #fff; }
        #dplayer { width: 100%; height: 220px; border-radius: 8px; overflow: hidden; }

        .container { padding: 0 20px; }
        .section-title { font-size: 16px; margin: 15px 0; color: #888; display: flex; justify-content: space-between; }
        
        /* BD风格海报墙 */
        .poster-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px; }
        .movie-card { background: #1f1f1f; border-radius: 8px; overflow: hidden; position: relative; cursor: pointer; transition: transform 0.2s; }
        .movie-card:active { transform: scale(0.96); }
        .poster-wrapper { width: 100%; height: 140px; background: #2a2a2a; position: relative; overflow: hidden; }
        .poster-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        .quality-tag { position: absolute; top: 5px; right: 5px; background: rgba(0,230,118,0.9); color: #000; font-size: 10px; font-weight: bold; padding: 2px 5px; border-radius: 3px; }
        .movie-info { padding: 8px; }
        .movie-title { font-size: 13px; font-weight: bold; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .movie-sub { font-size: 11px; color: #777; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .loading-text { text-align: center; color: #666; padding: 40px 0; font-size: 14px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">BD·影视</div>
    </header>

    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="搜索电影、电视剧、动漫..." onkeyup="if(event.keyCode===13) searchMovies()">
        <button onclick="searchMovies()">搜索</button>
    </div>

    <!-- 播放器区域 -->
    <div id="playerSection">
        <div id="playerTitle">正在播放</div>
        <div id="dplayer"></div>
    </div>

    <!-- 影片列表区域 -->
    <div class="container">
        <div class="section-title" id="sectionTitle"><span>热门推荐</span></div>
        <div id="movieGrid" class="poster-grid">
            <div class="loading-text">输入关键词搜索影片片源</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
