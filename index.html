<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>极简影视站 - Link+ Video</title>
    <!-- 引入 DPlayer 播放器样式 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dplayer/dist/DPlayer.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0f0f0f; color: #fff; }

        .app-container { width: 100%; max-width: 480px; height: 100vh; margin: 0 auto; background-color: #141414; display: flex; flex-direction: column; position: relative; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }

        /* 顶部标题栏 */
        .app-header { height: 50px; background-color: #1f1f1f; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #282828; font-size: 17px; font-weight: 500; color: #fff; }

        /* 搜索栏 */
        .search-bar { background-color: #1a1a1a; padding: 10px 16px; display: flex; gap: 8px; border-bottom: 1px solid #282828; align-items: center; }
        .search-bar input { flex: 1; padding: 8px 12px; background: #262626; border: 1px solid #333; color: #fff; border-radius: 4px; font-size: 14px; outline: none; }
        .search-bar button { padding: 8px 14px; background-color: #07C160; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 500; font-size: 14px; }

        /* 中部内容展示区（播放器 + 列表） */
        .content-area { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }

        /* 视频播放容器 */
        #player { width: 100%; height: 240px; background: #000; border-radius: 6px; overflow: hidden; display: none; }
        #player.active { display: block; }

        /* 电影列表九宫格 */
        .movie-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .movie-item { background: #1f1f1f; border-radius: 6px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; transition: transform 0.2s; }
        .movie-item:active { transform: scale(0.96); }
        .movie-poster { width: 100%; height: 130px; object-fit: cover; background: #2a2a2a; }
        .movie-title { padding: 8px; font-size: 12px; color: #ddd; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .tips { text-align: center; color: #666; font-size: 14px; margin-top: 40px; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- 顶部标题栏 -->
    <div class="app-header">极简影视</div>

    <!-- 搜索栏 -->
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="输入电影、电视剧关键词..." />
        <button id="searchBtn">搜片</button>
    </div>

    <!-- 中部滚动区 -->
    <div class="content-area" id="contentArea">
        <!-- 播放器 -->
        <div id="player"></div>

        <!-- 提示信息 -->
        <div class="tips" id="tipsText">输入关键词开始搜索想看的影视内容</div>

        <!-- 影片结果网格 -->
        <div class="movie-list" id="movieList"></div>
    </div>
</div>

<!-- 引入 HLS 核心库和 DPlayer 播放器 -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/dplayer/dist/DPlayer.min.js"></script>
<script src="app.js"></script>
</body>
</html>
