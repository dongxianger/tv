<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修罗影视 - 极简高清站</title>
    <link rel="stylesheet" href="style.css">
    <!-- 引入 DPlayer 播放器样式 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dplayer/dist/DPlayer.min.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="header">
        <div class="logo">修罗影视</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="输入关键词...用空格隔开">
            <button onclick="searchMovies()">搜索</button>
        </div>
    </header>

    <!-- 播放器区域（默认隐藏） -->
    <section id="playerSection" class="player-section" style="display:none;">
        <div class="player-header">
            <h3 id="playerTitle">正在播放</h3>
            <button onclick="closePlayer()" class="close-btn">关闭播放</button>
        </div>
        <div id="dplayer"></div>
    </section>

    <!-- 内容区域 -->
    <main class="main-container">
        <div class="section-header" id="sectionTitle">
            <span class="bar"></span>
            <h2>猜你喜欢</h2>
        </div>
        
        <!-- 视频列表网格 -->
        <div id="movieGrid" class="movie-grid">
            <div class="loading-tip">正在载入海报墙数据，请稍候...</div>
        </div>
    </main>

    <!-- 底部版权 -->
    <footer class="footer">
        <p>修罗影视 专注高清影视资源，打造沉浸式观影体验 Copyright © 2015-2026</p>
    </footer>

    <!-- 引入播放器依赖库 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/dplayer/dist/DPlayer.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
